# Goes in /opt/mailcow-dockerized/data/conf/nginx/ — Mailcow keeps files there across updates.
server {
  ssl_certificate /etc/ssl/mail/cert.pem;
  ssl_certificate_key /etc/ssl/mail/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  include /etc/nginx/conf.d/listen_plain.active;
  include /etc/nginx/conf.d/listen_ssl.active;
  server_name lndc.rw www.lndc.rw;
  server_tokens off;

  # `current` is a symlink to the live release, switched by /usr/local/bin/lndc-deploy.
  root /lndc-site/current;
  index index.html;

  # Mailcow's ACME client validates every name on the certificate through this path.
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    rewrite /.well-known/acme-challenge/(.*) /$1 break;
    root /web/.well-known/acme-challenge/;
  }

  if ($scheme = http) { return 301 https://lndc.rw$request_uri; }
  if ($host = www.lndc.rw) { return 301 https://lndc.rw$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # One URL per page: /about/ → /about (the root / is excluded by the pattern).
  location ~ ^/(.+)/$ {
    return 301 https://lndc.rw/$1$is_args$args;
  }

  # Astro fingerprints these file names, so they can be cached forever.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  error_page 404 /404.html;
}
